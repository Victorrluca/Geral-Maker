                                           <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                               {Object.entries(ev.scores).map(([k, v]) => (
                                                   <div key={k} className="flex justify-between p-2 bg-white rounded-lg border border-slate-100">
                                                       <span className="text-slate-500 font-medium">{EVALUATION_CRITERIA.find(c=>c.id===k)?.label}:</span>
                                                       <span className="font-bold text-slate-800">{v}</span>
                                                   </div>
                                               ))}
                                           </div>
                                       </div>
                                   ))
                               ) : (
                                   <div className="text-center py-12 border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50">
                                       <ClipboardCheck size={48} className="mx-auto mb-3 text-slate-300"/>
                                       <p className="text-slate-500 font-medium">Nenhuma avaliação encontrada.</p>
                                   </div>
                               )}
                           </div>
                       </div>
                   </div>
                )}

               {vacantModalOpen && selectedVacantSlot && (
                   <div className="fixed inset-0 z-max flex items-end sm:items-center justify-center p-4 backdrop-blur-sm bg-black/60">
                       <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 animate-scaleUp overflow-hidden">
                           <div className="flex justify-between items-center mb-6">
                               <div><h3 className="text-xl font-black text-slate-800">Polos Vagos</h3><p className="text-sm font-bold text-emerald-600">{selectedVacantSlot.label}</p></div>
                               <button onClick={()=>setVacantModalOpen(false)} className="bg-slate-100 p-2 rounded-full text-slate-500 hover:bg-slate-200"><X/></button>
                           </div>
                           <div className="space-y-2 max-h-[50vh] overflow-y-auto pr-2 custom-scrollbar">
                               {selectedVacantSlot.freeSchools.map((s,i)=>(
                                   <div key={i} className="p-4 bg-slate-50 rounded-2xl font-bold text-slate-700 flex items-center justify-between border border-slate-100">
                                       <span>{s.name}</span><div className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                                   </div>
                               ))}
                               {selectedVacantSlot.freeSchools.length === 0 && <p className="text-center text-slate-400 py-8 font-bold">Nenhum polo vago encontrado.</p>}
                           </div>
                           <button onClick={()=>setVacantModalOpen(false)} className="w-full mt-8 py-4 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold transition pb-safe">Fechar</button>
                       </div>
                   </div>
               )}

                {/* MODAL DE VISUALIZAÇÃO DE TURMA AUTOMÁTICA */}
                {scheduleStudentListOpen && selectedClassForList && (
                   <div className="fixed inset-0 z-max flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm bg-black/60">
                       <div className="bg-white rounded-t-3xl sm:rounded-2xl shadow-2xl w-full sm:max-w-lg p-0 animate-slideUp sm:animate-scaleUp flex flex-col overflow-hidden max-h-[90vh]">
                           <div className="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 md:p-8 text-white shrink-0 relative">
                               <div className="flex justify-between items-start mb-2">
                                   <h3 className="text-2xl font-black relative z-10 pr-8">{selectedClassForList.name}</h3>
                                   <button onClick={()=>setScheduleStudentListOpen(false)} className="p-2 bg-white/20 rounded-full hover:bg-white/30 text-white transition absolute top-6 right-6 z-20"><X size={20}/></button>
                               </div>
                               <p className="text-blue-100 text-sm font-medium flex items-center gap-2 relative z-10"><Users size={16}/> {selectedClassForList.students.length} alunos matriculados</p>
                           </div>
                           <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-2 bg-slate-50 custom-scrollbar pb-safe">
                               {selectedClassForList.students.map((s, idx) => {
                                   const sId = sanitizeId(s.id_pessoa || s.n_pessoa || `aluno-${idx}`);
                                   const stats = getStudentStats(s, idx);
                                   
                                   let badge = 'bg-slate-200 text-slate-600';
                                   let borderAlert = 'border-slate-200';
                                   let bgAlert = 'bg-white';
                                   
                                   if (stats.cons >= 3) {
                                       badge = 'bg-red-100 text-red-700 border border-red-200 animate-pulse';
                                       borderAlert = 'border-red-300';
                                       bgAlert = 'bg-red-50';
                                   } else if (stats.tot > 0) { 
                                       badge = stats.perc >= 75 ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : stats.perc >= 50 ? 'bg-amber-100 text-amber-700 border border-amber-200' : 'bg-red-100 text-red-700 border border-red-200'; 
                                   }

                                   return (
                                       <div key={sId} className={`p-4 rounded-2xl border flex items-center justify-between ${bgAlert} ${borderAlert}`}>
                                           <div className="flex items-center gap-3">
                                               <div className="w-10 h-10 rounded-full flex items-center justify-center font-black text-sm bg-slate-100 text-slate-500">{s.n_pessoa ? s.n_pessoa.charAt(0) : '?'}</div>
                                               <div>
                                                   <span className="font-bold block text-slate-800">{s.n_pessoa || 'Desconhecido'}</span>
                                                   <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md mt-1 inline-block ${badge}`}>Freq: {stats.perc}% {stats.cons >= 3 ? ' • Risco!' : ''}</span>
                                               </div>
                                           </div>
                                           <div className="text-right">
                                               <span className="block text-xs font-black text-slate-600 bg-slate-100 px-3 py-1 rounded-lg">{stats.freq} / {stats.tot}</span>
                                           </div>
                                       </div>
                                   )
                               })}
                           </div>
                           <div className="p-4 bg-white border-t border-slate-100 text-center text-xs text-slate-400 font-medium">
                               Dados extraídos automaticamente da planilha base • {new Date().toLocaleDateString('pt-BR')}
                           </div>
                       </div>
                   </div>
                )}

               {deleteModal.isOpen && (
                   <div className="fixed inset-0 z-max flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-md bg-black/60">
                       <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full sm:max-w-sm p-8 text-center animate-slideUp sm:animate-scaleUp pb-safe">
                           <div className="mx-auto w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mb-6 shadow-inner"><Trash2 size={32}/></div>
                           <h3 className="text-2xl font-black text-slate-800 mb-2">Confirmar Exclusão?</h3>
                           <p className="text-slate-500 text-sm mb-8 leading-relaxed">Tem a certeza que deseja apagar <strong>"{deleteModal.title}"</strong> da base de dados? Esta ação não pode ser desfeita.</p>
                           <div className="flex gap-3">
                               <button onClick={()=>setDeleteModal({isOpen:false})} className="flex-1 py-4 rounded-xl border border-slate-200 text-slate-600 font-bold hover:bg-slate-50 transition">Voltar</button>
                               <button onClick={executeDelete} className="flex-1 py-4 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold shadow-lg shadow-red-500/30 transition active:scale-95">Apagar</button>
                           </div>
                       </div>
                   </div>
               )}

               {importAlert && (
                    <div className="fixed inset-0 z-max flex items-center justify-center p-4 backdrop-blur-sm bg-black/60">
                        <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg p-8 relative animate-scaleUp">
                            <h3 className="text-xl font-black text-red-600 mb-4 flex items-center gap-2"><AlertTriangle/> {importAlert.title}</h3>
                            <div className="text-sm text-slate-700 whitespace-pre-wrap bg-red-50 p-6 rounded-2xl border border-red-100 font-medium leading-relaxed">
                                {importAlert.message}
                            </div>
                            <button onClick={() => setImportAlert(null)} className="mt-8 w-full bg-slate-800 hover:bg-slate-900 text-white py-4 rounded-xl font-bold transition active:scale-95 shadow-lg">Entendido</button>
                        </div>
                    </div>
                )}
            </div>
          );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
