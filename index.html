        // --- CONSTANTES ---
        const DAYS_OF_WEEK = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex'];

          { id: 1, label: '08:00 - 09:00', period: 'Manhã', startHour: 8, endHour: 9 },

            { id: 'm2', label: '2º Manhã', codeSlot: '2', period: 'M', startHour: 9, startMin: 10, endHour: 12, endMin: 30 },
            { id: 't1', label: '1º Tarde', codeSlot: '1', period: 'T', startHour: 12, startMin: 30, endHour: 15, endMin: 10 },

        ];

        const LEVEL_MAP = { '6': 'KIDS 1', '7': 'KIDS 2', '8': 'JUNIOR', '9': 'TEEN', '10': 'OBR', '11': 'INOVAÇÃO' };
        const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const WEEK_DAYS = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
        const DEFAULT_SCHOOLS_LIST = ["Armando Cavazza", "CARLOS OSMARINHO DE LIMA - PROFº", "Dorival Faria", "ELIZABETH PARMINONDI ROMERO - PROFª", "ELVIRA LEFÈVRE SALLES NEMER - PROFª", "Estevan Placêncio", "Ezio Berzaghi", "GILBERTO FLORÊNCIO - PROF.", "JOÃO DE ALMEIDA LEMOS", "LUIZ DE OLIVEIRA ANDRADE - PE", "NALY BENEDICTA B. C. MANCINI - PROFª", "Raposo Tavares", "Taro Mizutori", "Yojiro Takaoka", "Jorge Augusto - Prof", "Eneias Raimundo da Silva - Prof", "Alfredo do Carmo - Prof", "Egidio Costa - Prof"];
        const NOTE_CATEGORIES = [{ id: 'meeting', label: 'Reunião', color: 'bg-blue-100 text-blue-700' }, { id: 'instructor', label: 'Instrutores', color: 'bg-purple-100 text-purple-700' }, { id: 'routine', label: 'Rotina', color: 'bg-emerald-100 text-emerald-700' }, { id: 'general', label: 'Geral', color: 'bg-gray-100 text-gray-700' }];
        const EVALUATION_CRITERIA = [{ id: 'control', label: 'Controle de Turma' }, { id: 'tech', label: 'Domínio Técnico' }, { id: 'motivation', label: 'Motivação / Engajamento' }, { id: 'comm', label: 'Comunicação com Aluno' }, { id: 'didactic', label: 'Didática Pedagógica' }, { id: 'cleanliness', label: 'Organização e Limpeza' }];

        // --- FUNÇÕES AUXILIARES ---
        const formatDateLocal = (date) => { if(!date) return ''; const y = date.getFullYear(); const m = String(date.getMonth() + 1).padStart(2, '0'); const d = String(date.getDate()).padStart(2, '0'); return `${y}-${m}-${d}`; };
        const normalizeStr = (str) => str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim().replace(/\s+/g, ' ') : "";
        const findSchoolColumn = (row) => { const keys = Object.keys(row); if (row.n_polo) return 'n_polo'; if (row.polo) return 'polo'; return keys.find(k => k.toLowerCase().includes('polo') || k.toLowerCase().includes('escola')); };
        const detectShift = (turmaCode) => { if (!turmaCode) return 'Indefinido'; const code = String(turmaCode).toUpperCase(); if (/\d\s*M/.test(code)) return 'Manhã'; if (/\d\s*T/.test(code)) return 'Tarde'; return 'Indefinido'; };
        const getStudentClass = (s) => s.n_turma || s.turma || s.cod_turma || s.serie || ''; 
        
        const parseClassCode = (code) => { 
            if (!code) return null; 
            const clean = String(code).replace(/\s+/g, '').toUpperCase(); 
            const match = clean.match(/^(\d{1,2})([MT])(\d)(\d)/); 
            return match ? { module: match[1], period: match[2], day: parseInt(match[3]), slot: match[4] } : null; 
        };

        const getStudentRawData = (student) => {
            const keys = Object.keys(student);
            const norm = (str) => str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, '') : '';
            
            let tot = 0, faltas = 0, freqRaw = 0, cons = 0;
            let hasTot = false, hasFaltas = false, hasFreq = false, isPerc = false;

            const totKey = keys.find(k => {
                const n = norm(k);
                return (n.includes('qntd') || n.includes('qtde') || n.includes('total') || n.includes('aulasdada') || n.includes('ministrada')) && !n.includes('falta') && !n.includes('freq') && !n.includes('pres');
            });
            if (totKey && student[totKey] !== undefined && String(student[totKey]).trim() !== '') {
                hasTot = true;
                tot = parseInt(String(student[totKey]).replace(/[^0-9]/g, '')) || 0;
            }

            const faltasKey = keys.find(k => {
                const n = norm(k);
                return n === 'faltas' || n === 'falta' || n === 'f';
            });
            if (faltasKey && student[faltasKey] !== undefined && String(student[faltasKey]).trim() !== '') {
                hasFaltas = true;
                faltas = parseInt(String(student[faltasKey]).replace(/[^0-9]/g, '')) || 0;
            }

            const freqKey = keys.find(k => {
                const n = norm(k);
                return n.includes('freq') || n.includes('presen') || n.includes('assistid') || n.includes('pres');
            });
            if (freqKey && student[freqKey] !== undefined && String(student[freqKey]).trim() !== '') {
                hasFreq = true;
                const valStr = String(student[freqKey]).trim();
                if (valStr.includes('%') || norm(freqKey).includes('perc') || norm(freqKey).includes('porcent')) isPerc = true;
                freqRaw = parseInt(valStr.replace(/[^0-9]/g, '')) || 0;
            }

            const consKey = keys.find(k => {
                const n = norm(k);
                return n.includes('consec') || (n.includes('falta') && n.includes('seg'));
            });
            if (consKey && student[consKey] !== undefined && String(student[consKey]).trim() !== '') {
                cons = parseInt(String(student[consKey]).replace(/[^0-9]/g, '')) || 0;
            }

            return { tot, faltas, freqRaw, hasTot, hasFaltas, hasFreq, isPerc, cons };
        };

        const sanitizeId = (str) => {
            if (!str) return Math.random().toString(36).substring(7);
            return String(str).replace(/[^a-zA-Z0-9_-]/g, '_');
        };

        const isCurrentAutoSlot = (dayIndex, slot) => {
            const now = new Date();
            const currentDay = now.getDay() - 1; // 0 = Seg
            if (currentDay !== dayIndex) return false;
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const startMinutes = slot.startHour * 60 + slot.startMin;
            const endMinutes = slot.endHour * 60 + slot.endMin;
            return currentMinutes >= startMinutes && currentMinutes < endMinutes;
        };

        const callGemini = async (prompt) => {
            if (!GEMINI_API_KEY) return "⚠️ Chave da API Gemini não configurada.";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
                });
                if (!response.ok) throw new Error('Erro API');
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Sem resposta.";
            } catch (error) { return "Erro IA: " + error.message; }
        };

        const Toast = ({ message, onClose }) => {
            if (!message) return null;
            return (

                        <button onClick={onClose} className="hover:text-gray-300 p-1"><X size={18} /></button>
                    </div>
                </div>
            );
        };

        class ErrorBoundary extends React.Component {
          constructor(props) { super(props); this.state = { hasError: false }; }
          static getDerivedStateFromError(error) { return { hasError: true }; }
          componentDidCatch(error, errorInfo) { console.error("Erro React:", error, errorInfo); }
          render() {
            if (this.state.hasError) {
              return (
                <div className="min-h-screen flex items-center justify-center bg-red-50 p-8 text-center">
                    <div className="bg-white p-10 rounded-3xl shadow-xl max-w-sm border border-red-100">
                        <AlertOctagon size={48} className="mx-auto mb-4 text-red-600"/>
                        <h1 className="text-xl font-black text-slate-800">Falha no Carregamento</h1>
                        <p className="text-slate-500 text-sm mt-2 mb-6">Ocorreu um erro inesperado na interface. Os seus dados estão seguros.</p>
                        <button onClick={() => window.location.reload()} className="w-full bg-red-600 text-white py-3 rounded-xl font-bold">Recarregar App</button>
                    </div>
                </div>
              );
            }
            return this.props.children;
          }
        }

        const SlotCard = ({ date, slot, visits, schools, onOpenModal }) => {
            const dateStr = formatDateLocal(date);
            const visit = visits.find(v => v.date === dateStr && v.slot === slot.id);
            const school = schools.find(s => s.id === visit?.schoolId);
            const baseClasses = "flex flex-col justify-between p-2 rounded-lg border cursor-pointer transition-all active:scale-95 h-20 md:h-24";

            if (visit?.status === 'holiday') return (
                <div onClick={() => onOpenModal(date, slot.id)} className={`${baseClasses} border-orange-300 bg-orange-100`}>
                    <div className="flex flex-col items-center justify-center h-full">
                        <CalendarOff className="text-orange-500 mb-1" size={16} />
                        <span className="font-bold text-orange-600 text-[10px] uppercase text-center leading-tight line-clamp-2">{visit.notes || 'FERIADO'}</span>
                    </div>
                </div>
            );

            if (visit?.status === 'absence') return (
                <div onClick={() => onOpenModal(date, slot.id)} className={`${baseClasses} border-red-300 bg-red-100`}>
                     <div className="flex flex-col items-center justify-center h-full">
                        <UserX className="text-red-500 mb-1" size={16} />
                        <span className="font-bold text-red-600 text-[10px] uppercase text-center leading-tight line-clamp-2">{visit.notes || 'AUSÊNCIA'}</span>
                    </div>
                </div>
            );
            
            let bg='bg-gray-50', border='border-gray-200', text='text-gray-400', icon=null;
            if (visit && school) {
                if (visit.status==='visited') { bg='bg-emerald-50'; border='border-emerald-300'; text='text-emerald-700'; icon=<Check size={14} className="text-emerald-500"/>; }
                else if (visit.status==='missed') { bg='bg-amber-50'; border='border-amber-300'; text='text-amber-700'; icon=<AlertTriangle size={14} className="text-amber-500"/>; }
                else { bg='bg-blue-50'; border='border-blue-200'; text='text-blue-700'; }
            }

            return (
                <div onClick={() => onOpenModal(date, slot.id)} className={`${baseClasses} ${bg} ${border}`}>
                    <div className="flex justify-between items-start">
                        <span className="text-[10px] font-bold uppercase tracking-wider text-gray-500">{slot.label.split('-')[0]}</span>
                        {icon}
                    </div>
                    <div className={`text-xs font-medium leading-tight ${text} line-clamp-2`}>{school ? school.name : 'Disponível'}</div>
                </div>
            );
        };

        const PublicDashboard = ({ shareId, db, appId, auth }) => {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                let unsubscribe = null;
                const initPublic = async () => {
                    try {
                        if (auth && !auth.currentUser) {
                            try {
                                await signInAnonymously(auth);
                            } catch (authErr) {
                                console.warn("Login anônimo não está ativado no Firebase. A tentar leitura pública direta...");
                            }
                        }
                        
                        const ref = doc(db, 'artifacts', appId, 'public', 'data', 'shared_dashboards', shareId);
                        unsubscribe = onSnapshot(ref, (snap) => {
                            if (snap.exists()) {
                                setData(snap.data());
                                setError(null);
                            } else {
                                setError("Este painel de escola não existe ou já foi removido.");
                            }
                            setLoading(false);
                        }, (err) => { 
                            console.error("Erro Firebase:", err);
                            setError("Permissão negada no banco de dados. Por favor, ative o 'Login Anónimo' no seu Firebase ou ajuste as Regras do Firestore."); 
                            setLoading(false); 
                        });
                    } catch (e) { 
                        console.error("Erro interno:", e);
                        setError("Falha técnica ao inicializar a página: " + e.message); 
                        setLoading(false); 
                    }
                };
                initPublic();
                
                return () => {
                    if (unsubscribe) unsubscribe();
                };
            }, [shareId, db, appId, auth]);

            if (loading) return <div className="min-h-screen flex items-center justify-center bg-slate-50"><Loader2 className="animate-spin text-blue-600 w-12 h-12"/></div>;
            if (error) return <div className="min-h-screen flex items-center justify-center bg-slate-50"><div className="bg-white p-8 rounded-3xl shadow-xl border border-red-100 max-w-sm text-center"><AlertTriangle className="mx-auto mb-4 text-red-500" size={48}/><p className="text-red-700 font-bold">{error}</p></div></div>;

            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-900 pb-20">
                    <div className="max-w-5xl mx-auto space-y-6 animate-fadeIn">
                        <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative overflow-hidden">

                                <h1 className="text-2xl font-black text-slate-800 flex items-center gap-3"><School className="text-blue-600"/> {data?.schoolName || 'Polo Desconhecido'}</h1>
                                <p className="text-sm text-slate-500 font-medium mt-1">Acesso Leitura • Atualizado em: {data?.updatedAt ? new Date(data.updatedAt).toLocaleDateString('pt-BR') : '--'} às {data?.updatedAt ? new Date(data.updatedAt).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) : '--'}</p>
                            </div>
                            <div className="bg-blue-50 border border-blue-100 text-blue-700 px-5 py-3 rounded-2xl font-bold flex items-center gap-2">
                                <Users size={20}/> {data?.stats?.total || 0} Alunos Matriculados
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-gradient-to-br from-emerald-50 to-green-50 border border-emerald-100 p-8 rounded-3xl shadow-sm">
                                <p className="text-emerald-800 text-xs font-bold uppercase tracking-wider mb-2">Média de Presença</p>
                                <h3 className="text-6xl font-black text-emerald-600 flex items-center gap-2"><Percent size={48}/> {data?.stats?.avgPercentage || 0}%</h3>
                            </div>
                            <div className="bg-white border border-slate-200 p-8 rounded-3xl shadow-sm">
                                <p className="text-slate-500 text-xs font-bold uppercase tracking-wider mb-2">Alunos Frequentes Ativamente</p>
                                <h3 className="text-6xl font-black text-blue-600">{data?.stats?.attending || 0} <span className="text-2xl text-slate-400 font-bold">/ {data?.stats?.total || 0}</span></h3>
                            </div>
                        </div>

                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden mt-8">
                            <div className="bg-slate-50 px-6 py-5 border-b border-slate-200 flex items-center justify-between">
                                <h3 className="font-black text-slate-800 text-lg flex items-center gap-2"><List size={20} className="text-blue-500"/> Lista de Alunos</h3>
                            </div>
                            <div className="overflow-x-auto max-h-[60vh] custom-scrollbar">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-white text-slate-500 font-bold sticky top-0 shadow-sm z-10">
                                        <tr>
                                            <th className="p-4 border-b border-slate-100 uppercase tracking-wide text-xs">Aluno</th>
                                            <th className="p-4 border-b border-slate-100 uppercase tracking-wide text-xs">Turma</th>
                                            <th className="p-4 border-b border-slate-100 text-center uppercase tracking-wide text-xs">Frequência</th>
                                            <th className="p-4 border-b border-slate-100 text-center uppercase tracking-wide text-xs">Semana</th>
                                            <th className="p-4 border-b border-slate-100 text-center uppercase tracking-wide text-xs">Faltas Consecutivas</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {data?.students?.map((s, i) => {
                                            let badgeColor = 'bg-slate-100 text-slate-600 border border-slate-200';
                                            if (s.total > 0) {
                                                if (s.percentage >= 75) badgeColor = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
                                                else if (s.percentage >= 50) badgeColor = 'bg-amber-50 text-amber-700 border border-amber-200';
                                                else badgeColor = 'bg-red-50 text-red-700 border border-red-200';
                                            }

                                            return (
                                                <tr key={i} className="hover:bg-slate-50 transition-colors">
                                                    <td className="p-4 font-bold text-slate-800">{s.name}</td>
                                                    <td className="p-4 text-slate-600 font-medium">
                                                        <div className="flex items-center gap-2">
                                                            {s.classCode}
                                                            {s.shift === 'Manhã' && <Sun size={14} className="text-amber-500"/>}
                                                            {s.shift === 'Tarde' && <Moon size={14} className="text-indigo-500"/>}
                                                        </div>
                                                    </td>
                                                    <td className="p-4 text-center">
                                                        <span className={`px-3 py-1.5 rounded-xl font-bold text-xs ${badgeColor}`}>
                                                            {s.freq} / {s.total} ({s.percentage}%)
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-center">
                                                        {s.trend > 0 ? (
                                                            <span className="text-emerald-500 flex items-center justify-center gap-1 text-xs font-bold"><TrendingUp size={14}/> +{s.trend}%</span>
                                                        ) : s.trend < 0 ? (
                                                            <span className="text-red-500 flex items-center justify-center gap-1 text-xs font-bold"><TrendingDown size={14}/> {s.trend}%</span>
                                                        ) : (
                                                            <span className="text-slate-300 flex items-center justify-center gap-1 text-xs font-bold"><Minus size={14}/></span>
                                                        )}
                                                    </td>
                                                    <td className="p-4 text-center">
                                                        {s.consecutive >= 3 ? (
                                                            <span className="text-xs bg-red-100 text-red-700 font-bold px-3 py-1.5 rounded-xl flex items-center justify-center gap-1.5 w-fit mx-auto shadow-sm border border-red-200"><AlertTriangle size={14}/> {s.consecutive} Faltas</span>
                                                        ) : (
                                                            <span className="text-xs text-slate-400 font-medium">—</span>
                                                        )}
                                                    </td>
                                                </tr>
                                            )
                                        })}
                                        {(!data?.students || data.students.length === 0) && (
                                            <tr>
                                                <td colSpan="5" className="text-center py-8 text-slate-500 font-bold">Nenhum aluno encontrado para este polo.</td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AuthScreen = ({ keepLoggedIn, setKeepLoggedIn }) => {
          const [isRegistering, setIsRegistering] = useState(false);
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          const [error, setError] = useState('');
          const [loading, setLoading] = useState(false);

          const handleAuth = async (e) => {
            e.preventDefault(); 
            setError(''); 
            setLoading(true);
            try {
                const persistence = keepLoggedIn ? browserLocalPersistence : browserSessionPersistence;
                await setPersistence(auth, persistence);
                if (isRegistering) await createUserWithEmailAndPassword(auth, email, password);
                else await signInWithEmailAndPassword(auth, email, password);
            } catch (err) { setError('Credenciais inválidas. Verifique os dados ou crie uma conta.'); } finally { setLoading(false); }
          };
          
          return (
            <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6 relative overflow-hidden">
              <div className="absolute inset-0 bg-gradient-to-br from-blue-50 to-indigo-100 z-0"></div>
              <div className="glass-panel rounded-3xl shadow-2xl w-full max-w-sm p-10 animate-fadeIn z-10 relative">
                <div className="text-center mb-8">
                    <div className="bg-gradient-to-tr from-blue-600 to-indigo-500 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-6 text-white shadow-lg"><User size={40} /></div>
                    <h1 className="text-3xl font-extrabold text-slate-800 tracking-tight">{isRegistering ? 'Nova Conta' : 'Acesso Pessoal'}</h1>
                </div>
                {error && <div className="bg-red-50 border border-red-100 text-red-600 p-4 rounded-xl mb-6 text-xs font-bold text-center">{error}</div>}
                <form onSubmit={handleAuth} className="space-y-5">
                  <input type="email" required className="w-full p-4 border rounded-xl outline-none focus:ring-2 ring-blue-500/20" placeholder="E-mail" value={email} onChange={(e) => setEmail(e.target.value)} />
                  <input type="password" required className="w-full p-4 border rounded-xl outline-none focus:ring-2 ring-blue-500/20" placeholder="Senha" value={password} onChange={(e) => setPassword(e.target.value)} />
                  <div className="flex items-center gap-3">
                      <input type="checkbox" id="keep" checked={keepLoggedIn} onChange={(e) => setKeepLoggedIn(e.target.checked)} className="w-5 h-5 rounded border-slate-300 text-blue-600"/>
                      <label htmlFor="keep" className="text-sm text-slate-600 font-medium cursor-pointer">Manter conectado</label>
                  </div>
                  <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition">
                      {loading ? <Loader2 className="animate-spin mx-auto"/> : (isRegistering ? 'Cadastrar' : 'Entrar')}
                  </button>
                </form>
                <button onClick={() => setIsRegistering(!isRegistering)} className="mt-8 w-full text-center text-sm text-slate-600 font-bold">{isRegistering ? 'Já tenho conta' : 'Criar nova conta'}</button>
              </div>
            </div>
          );
        };

        const App = () => {
          const [shareParam, setShareParam] = useState(() => {
              const hash = window.location.hash;
              return hash.startsWith('#share=') ? hash.replace('#share=', '') : null;
          });
          const isSharedView = !!shareParam;

          const [user, setUser] = useState(null);
          const [loading, setLoading] = useState(true);
          const [view, setView] = useState('home'); 
          const [subView, setSubView] = useState('stats'); 
          const [schools, setSchools] = useState([]);
          const [visits, setVisits] = useState([]);
          const [instructors, setInstructors] = useState([]); 
          const [evaluations, setEvaluations] = useState([]); 
          const [notes, setNotes] = useState([]); 
          const [weeklyHist, setWeeklyHist] = useState([]); 
          const [importedStudents, setImportedStudents] = useState([]); 
          const [classAttendance, setClassAttendance] = useState({}); 

          const [currentDate, setCurrentDate] = useState(new Date());
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [isEvalModalOpen, setIsEvalModalOpen] = useState(false);
          const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
          const [isNoteModalOpen, setIsNoteModalOpen] = useState(false); 
          const [isHistoryManagerOpen, setIsHistoryManagerOpen] = useState(false);
          const [importAlert, setImportAlert] = useState(null);
          const [keepLoggedIn, setKeepLoggedIn] = useState(true);

          const [selectedSlot, setSelectedSlot] = useState(null);
          const [selectedVacantSlot, setSelectedVacantSlot] = useState(null);
          const [vacantModalOpen, setVacantModalOpen] = useState(false);
          const [scheduleStudentListOpen, setScheduleStudentListOpen] = useState(false);
          const [selectedClassForList, setSelectedClassForList] = useState(null);
          const [mobileScheduleDay, setMobileScheduleDay] = useState(new Date().getDay() > 0 && new Date().getDay() < 6 ? new Date().getDay() - 1 : 0);

          const [editData, setEditData] = useState({ schoolId: '', status: 'visited', type: 'Pedagógica', notes: '', isHoliday: false, isAbsence: false });
          const [evalData, setEvalData] = useState({ instructorId: '', scores: {}, comments: {} }); 
          const [noteData, setNoteData] = useState({ title: '', content: '', category: 'general', date: '' }); 
          const [historyData, setHistoryData] = useState({ instructorName: '', evaluations: [] }); 
          
          const [notification, setNotification] = useState(null);
          const [deleteModal, setDeleteModal] = useState({ isOpen: false, type: null, id: null, title: '' });
          const [rawCsvData, setRawCsvData] = useState('');
          const [selectedSchoolFilter, setSelectedSchoolFilter] = useState('');
          const [selectedShiftFilter, setSelectedShiftFilter] = useState('todos'); 
          const [searchTerm, setSearchTerm] = useState('');
          
          const fileInputRef = useRef(null);

          useEffect(() => {
              const handleHashChange = () => {
                  const hash = window.location.hash;
                  setShareParam(hash.startsWith('#share=') ? hash.replace('#share=', '') : null);
              };
              window.addEventListener('hashchange', handleHashChange);
              return () => window.removeEventListener('hashchange', handleHashChange);
          }, []);

          const classMaxTotals = useMemo(() => {
              const maxes = {};
              importedStudents.forEach(s => {
                  const code = normalizeStr(getStudentClass(s));
                  const data = getStudentRawData(s);
                  
                  let implied = data.tot;
                  if (!data.hasTot && !data.isPerc) {
                      if (data.hasFreq && data.hasFaltas) implied = data.freqRaw + data.faltas;
                      else if (data.hasFreq) implied = data.freqRaw;
                      else if (data.hasFaltas) implied = data.faltas;
                  }
                  
                  if (!maxes[code] || implied > maxes[code]) {
                      maxes[code] = implied;
                  }
              });
              return maxes;
          }, [importedStudents]);

          const getStudentStats = (student, idx = 0) => {
              const sId = sanitizeId(student.id_pessoa || student.n_pessoa || `aluno-${idx}`);
              const classCodeRaw = getStudentClass(student);
              const classCode = normalizeStr(classCodeRaw);
              const data = getStudentRawData(student);
              
              let baseTot = data.tot;
              let baseFreq = 0;

              if (data.hasTot && data.tot > 0) {
                  if (data.hasFaltas) baseFreq = Math.max(0, baseTot - data.faltas);
                  else if (data.hasFreq) baseFreq = data.isPerc ? Math.round((data.freqRaw / 100) * baseTot) : data.freqRaw;
              } else {
                  baseTot = classMaxTotals[classCode] || 0;
                  if (data.hasFreq) {
                      baseFreq = data.isPerc ? Math.round((data.freqRaw / 100) * baseTot) : data.freqRaw;
                  } else if (data.hasFaltas) {
                      baseFreq = Math.max(0, baseTot - data.faltas);
                  }
              }

              let localFreq = 0;
              let localDates = new Set();
              
              Object.keys(classAttendance).forEach(key => {
                  if (classAttendance[key] && classCodeRaw && key.startsWith(`${classCodeRaw}_`)) {
                      const datePart = key.substring(key.lastIndexOf('_') + 1);
                      localDates.add(datePart);
                      const middlePart = key.substring(classCodeRaw.length + 1, key.lastIndexOf('_'));
                      if (middlePart === sId) localFreq++;
                  }
              });

              const totalFreq = baseFreq + localFreq;
              
              let totalClasses = baseTot + localDates.size;
              if (totalClasses < totalFreq) totalClasses = totalFreq;

              let perc = 0;
              if (totalClasses > 0) {
                  perc = Math.round((totalFreq / totalClasses) * 100);
              } else if (data.isPerc) {
                  perc = data.freqRaw > 100 ? 100 : data.freqRaw;
              }

              // Tendência (Frequência da semana passada)
              const pastPerc = (weeklyHist.length > 0 && weeklyHist[0].studentData && weeklyHist[0].studentData[sId] !== undefined) 
                               ? weeklyHist[0].studentData[sId] 
                               : perc; 
              const trend = perc - pastPerc;

              return { freq: totalFreq, tot: totalClasses, perc, cons: data.cons, sId, trend };
          };

          const filteredStudentsList = useMemo(() => {
              let data = importedStudents;
              if (selectedSchoolFilter) {
                 const norm = normalizeStr(selectedSchoolFilter);
                 data = data.filter(s => normalizeStr(s[findSchoolColumn(s)]).includes(norm));
              }
              if (selectedShiftFilter !== 'todos') {
                  data = data.filter(s => {
                      const shift = detectShift(getStudentClass(s));
                      return selectedShiftFilter === 'manha' ? shift === 'Manhã' : shift === 'Tarde';
                  });
              }
              if (searchTerm) {
                 const term = searchTerm.toLowerCase();
                 data = data.filter(s => (s.n_pessoa || '').toLowerCase().includes(term));
              }
              return data;
          }, [importedStudents, selectedSchoolFilter, selectedShiftFilter, searchTerm]);

          const dashboardStats = useMemo(() => {
              const total = filteredStudentsList.length;
              let attending = 0;
              let sumPerc = 0; 
              
              filteredStudentsList.forEach((s, idx) => {
                  const stats = getStudentStats(s, idx);
                  if (stats.perc > 0) attending++;
                  sumPerc += stats.perc; 
              });
              
              const avgPercentage = total > 0 ? Math.round(sumPerc / total) : 0;
              return { total, attending, avgPercentage };
          }, [filteredStudentsList, classAttendance]);

          const classDistribution = useMemo(() => {
              const counts = {};
              filteredStudentsList.forEach(s => {
                  const code = getStudentClass(s);
                  const parsed = parseClassCode(code);
                  let levelName = 'Outros';
                  
                  if (parsed && LEVEL_MAP[parsed.module]) {
                      levelName = LEVEL_MAP[parsed.module];
                  } else if (s.n_mc) {
                      levelName = String(s.n_mc).toUpperCase().trim();
                  }

                  counts[levelName] = (counts[levelName] || 0) + 1;
              });
              
              return Object.entries(counts)
                  .map(([name, count]) => ({ name, count }))
                  .sort((a, b) => b.count - a.count); 
          }, [filteredStudentsList]);

          const autoSchedule = useMemo(() => {
              const schedule = {};
              const target = selectedSchoolFilter 
                ? importedStudents.filter(s => normalizeStr(s[findSchoolColumn(s)]).includes(normalizeStr(selectedSchoolFilter)))
                : [];

              target.forEach(student => {
                  const parsed = parseClassCode(getStudentClass(student));
                  if (parsed) {
                      const dayIdx = parsed.day - 2;
                      const slotKey = parsed.period === 'M' ? (parsed.slot === '1' ? 'm1' : 'm2') : (parsed.slot === '1' ? 't1' : 't2');
                      if (dayIdx >= 0 && dayIdx <= 4) {
                          const key = `${dayIdx}_${slotKey}`;
                          if (!schedule[key]) schedule[key] = { name: LEVEL_MAP[parsed.module] || `Módulo ${parsed.module}`, code: getStudentClass(student), students: [], count: 0 };
                          if (schedule[key].code === getStudentClass(student)) {
                              schedule[key].students.push(student);
                              schedule[key].count++;
                          }
                      }
                  }
              });
              return schedule;
          }, [importedStudents, selectedSchoolFilter]);

          const topSchools = useMemo(() => {
              if (importedStudents.length === 0) return [];
              const counts = {};
              importedStudents.forEach(s => {
                  const poloKey = findSchoolColumn(s);
                  const poloName = s[poloKey] || 'Desconhecido';
                  const normalizedPoloRaw = normalizeStr(poloName);
                  const matchedSchool = schools.find(sch => 
                      normalizedPoloRaw.includes(normalizeStr(sch.name)) || 
                      normalizeStr(sch.name).includes(normalizedPoloRaw)
                  );
                  const finalName = matchedSchool ? matchedSchool.name : poloName.trim();
                  counts[finalName] = (counts[finalName] || 0) + 1;
              });
              return Object.entries(counts).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count).slice(0, 3);
          }, [importedStudents, schools]);

          const monthDays = useMemo(() => {
            const date = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const days = [];
            while (date.getMonth() === currentDate.getMonth()) {
              const dow = date.getDay();
              if (dow >= 1 && dow <= 5) days.push(new Date(date));
              date.setDate(date.getDate() + 1);
            }
            return days;
          }, [currentDate]);

          const weeks = useMemo(() => {
            const weeksArr = []; let cur = [];
            monthDays.forEach(d => { if (cur.length > 0 && d.getDay() === 1) { weeksArr.push(cur); cur = []; } cur.push(d); });
            if (cur.length > 0) weeksArr.push(cur);
            return weeksArr;
          }, [monthDays]);

          const schoolCountsInMonth = useMemo(() => {
             const counts = {}; 
             const prefix = formatDateLocal(currentDate).slice(0, 7);
             visits.forEach(v => {
               if (v.date.startsWith(prefix) && v.schoolId && v.status !== 'holiday') counts[v.schoolId] = (counts[v.schoolId] || 0) + 1;
             });
             return counts;
          }, [visits, currentDate]);

          const unvisitedSchools = useMemo(() => {
             const prefix = formatDateLocal(currentDate).slice(0, 7);
             const currentMonthVisits = visits.filter(v => v.date.startsWith(prefix) && v.status !== 'holiday');
             const validSchools = schools.filter(s => !s.name.toUpperCase().includes("CAP"));
             const pendingList = [];
             validSchools.forEach(school => {
                 const isDouble = school.isDouble || !!school.instructor2Id;
                 const schoolVisits = currentMonthVisits.filter(v => v.schoolId === school.id);
                 const hasMorning = schoolVisits.some(v => v.slot === 1 || v.slot === 2);
                 const hasAfternoon = schoolVisits.some(v => v.slot === 3 || v.slot === 4);
                 if (isDouble) {
                     if (!hasMorning) pendingList.push({ ...school, name: `${school.name} (Manhã)`, originalName: school.name });
                     if (!hasAfternoon) pendingList.push({ ...school, name: `${school.name} (Tarde)`, originalName: school.name });
                 } else {
                     if (schoolVisits.length === 0) pendingList.push(school);
                 }
             });
             return pendingList;
          }, [schools, visits, currentDate]);

          const instructorStats = useMemo(() => {
            return instructors.map(inst => {
                const instructorEvals = evaluations.filter(e => e.instructorId === inst.id);
                const totalScore = instructorEvals.reduce((acc, curr) => acc + (curr.average || 0), 0);
                const avg = instructorEvals.length ? (totalScore / instructorEvals.length) : 0;
                return { ...inst, average: avg, count: instructorEvals.length };
            }).sort((a, b) => b.average - a.average);
          }, [instructors, evaluations]);
          
          const riskStudents = useMemo(() => {
             return importedStudents.filter((s, idx) => getStudentStats(s, idx).cons >= 3);
          }, [importedStudents, classAttendance]);

          const schoolRankings = useMemo(() => {
             const map = new Map();
             importedStudents.forEach((s, idx) => {
                 const poloKey = findSchoolColumn(s);
                 let poloName = s[poloKey];
                 if (!poloName) { poloName = 'Desconhecido'; } 
                 else { poloName = poloName.trim(); }
                 const normalizedPoloRaw = normalizeStr(poloName);
                 const matchedSchool = schools.find(sch => 
                      normalizedPoloRaw.includes(normalizeStr(sch.name)) || 
                      normalizeStr(sch.name).includes(normalizedPoloRaw)
                 );
                 const finalName = matchedSchool ? matchedSchool.name : poloName;
                 const normalizedKey = normalizeStr(finalName); 

                 const stats = getStudentStats(s, idx);

                 if(!map.has(normalizedKey)) map.set(normalizedKey, { name: finalName, sumPerc: 0, students: 0 });
                 const entry = map.get(normalizedKey);
                 entry.sumPerc += stats.perc; 
                 entry.students++;
             });
             
             const ranking = Array.from(map.values()).map(r => ({ 
                 ...r, 
                 percentage: r.students > 0 ? Math.round(r.sumPerc / r.students) : 0 
             }));
             
             const top3 = [...ranking].sort((a,b) => b.students - a.students).slice(0, 3);
             const bottom3 = [...ranking].filter(r => r.students > 0).sort((a,b) => a.students - b.students).slice(0, 3);
             const topFreq = [...ranking].filter(r => r.students > 0).sort((a,b) => b.percentage - a.percentage).slice(0, 3);
             const bottomFreq = [...ranking].filter(r => r.students > 5).sort((a,b) => a.percentage - b.percentage).slice(0, 3);
             return { full: ranking, top3, bottom3, topFreq, bottomFreq };
          }, [importedStudents, schools, classAttendance]);

          const freeSchoolsForSlot = (dayIndex, slotId) => {
             const busySchoolNamesStr = new Set();
             importedStudents.forEach(student => {
                 const code = getStudentClass(student);
                 const parsed = parseClassCode(code);
                 if (parsed) {
                     const sDayIndex = parsed.day - 2; 
                     let sSlotKey = '';
                     if (parsed.slot === '1') sSlotKey = (parsed.period === 'M') ? 'm1' : 't1';
                     if (parsed.slot === '2') sSlotKey = (parsed.period === 'M') ? 'm2' : 't2';
                     
                     if (sDayIndex === dayIndex && sSlotKey === slotId) {
                         const poloKey = findSchoolColumn(student);
                         const poloName = student[poloKey] || '';
                         if(poloName) busySchoolNamesStr.add(normalizeStr(poloName));
                     }
                 }
             });
             return schools.filter(s => {
                 const myName = normalizeStr(s.name);
                 const isBusy = Array.from(busySchoolNamesStr).some(busyName => busyName.includes(myName) || myName.includes(busyName));
                 return !isBusy;
             });
          };

          const showToast = (m) => { setNotification(m); setTimeout(() => setNotification(null), 3000); };
          const handlePrevMonth = () => { const d = new Date(currentDate); d.setMonth(d.getMonth() - 1); setCurrentDate(d); };
          const handleNextMonth = () => { const d = new Date(currentDate); d.setMonth(d.getMonth() + 1); setCurrentDate(d); };

          const openAddNoteModal = () => { 
             setNoteData({ title: '', content: '', category: 'general', date: formatDateLocal(new Date()) }); 
             setIsNoteModalOpen(true); 
          };

          const openModal = (date, slotId) => {
            const dateStr = formatDateLocal(date);
            const v = visits.find(v => v.date === dateStr && v.slot === slotId);
            setSelectedSlot({ dateStr, slotId, dateObj: date });
            setEditData(v ? { schoolId: v.schoolId || '', status: v.status, type: v.type || 'Pedagógica', notes: v.notes || '', isHoliday: v.status === 'holiday', isAbsence: v.status === 'absence' } : { schoolId: '', status: 'visited', type: 'Pedagógica', notes: '', isHoliday: false, isAbsence: false });
            setIsModalOpen(true);
          };

          const handleNoteToGoogleCalendar = (title, content) => {
            const sDate = new Date();
            const eDate = new Date(); eDate.setHours(eDate.getHours() + 1);
            const pad = n => n.toString().padStart(2, '0');
            const fmtLocal = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
            window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title || 'Anotação')}&dates=${fmtLocal(sDate)}/${fmtLocal(eDate)}&details=${encodeURIComponent(content || '')}`, '_blank');
          };

          const handleAddToGoogleCalendar = () => {
            if (!selectedSlot) return;
            const slotInfo = SLOTS.find(s => s.id === selectedSlot.slotId);
            
            let title = "Visita Pedagógica";
            let location = "";
            
            if (editData.isHoliday) title = "Feriado";
            else if (editData.isAbsence) title = "Ausência";
            else if (editData.schoolId) {
                const school = schools.find(s => s.id === editData.schoolId);
                title = `Visita: ${school ? school.name : 'Polo'}`;
                location = school ? school.name : "";
            }

            const sDate = new Date(selectedSlot.dateObj); sDate.setHours(slotInfo.startHour, 0, 0);
            const eDate = new Date(selectedSlot.dateObj); eDate.setHours(slotInfo.endHour, 0, 0);
            
            const pad = n => n.toString().padStart(2, '0');
            const fmtLocal = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
            
            window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${fmtLocal(sDate)}/${fmtLocal(eDate)}&details=${encodeURIComponent(editData.notes || '')}&location=${encodeURIComponent(location)}`, '_blank');
          };

          const saveNote = async () => {
              if (!noteData.title || !noteData.content) return showToast("Preencha título e conteúdo.");
              try {
                  await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'notes'), { ...noteData, createdAt: new Date().toISOString() });
                  setIsNoteModalOpen(false); showToast("Nota guardada com sucesso!");
              } catch(e) { showToast("Erro: " + e.message); }
          };

          const saveVisit = async () => {
            const docId = `${selectedSlot.dateStr}_slot_${selectedSlot.slotId}`;
            const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'visits', docId);
            if (editData.isHoliday) await setDoc(ref, { date: selectedSlot.dateStr, slot: selectedSlot.slotId, schoolId: null, status: 'holiday', notes: editData.notes || 'Feriado' });
            else if (editData.isAbsence) await setDoc(ref, { date: selectedSlot.dateStr, slot: selectedSlot.slotId, schoolId: null, status: 'absence', notes: editData.notes || 'Ausência' });
            else if (!editData.schoolId) await deleteDoc(ref);
            else await setDoc(ref, { date: selectedSlot.dateStr, slot: selectedSlot.slotId, schoolId: editData.schoolId, status: editData.status, notes: editData.notes, type: editData.type });
            setIsModalOpen(false);
          };
          
          const handleAutoSlotClickWrapper = (d, s) => {
              const key = `${d}_${s}`;
              if (autoSchedule[key]) { setSelectedClassForList(autoSchedule[key]); setScheduleStudentListOpen(true); }
              else if (selectedSchoolFilter) showToast("Nenhum aluno neste horário.");
          };

          const handleVacantSlotClick = (day, slotId) => {
             const free = freeSchoolsForSlot(day, slotId);
             setSelectedVacantSlot({ label: AUTO_CLASS_SLOTS.find(x => x.id === slotId).label, freeSchools: free });
             setVacantModalOpen(true);
          };

          const updateSchool = async (id, data) => { try { await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'schools', id), data); } catch(e) {} };
          const addSchool = async (e) => { e.preventDefault(); const n = e.target.n.value; if(n.trim()) await addDoc(collection(db,'artifacts',appId,'users',user.uid,'schools'),{name:n}); e.target.reset(); };
          const addInstructor = async (e) => { e.preventDefault(); const n = e.target.n.value; if(n.trim()) await addDoc(collection(db,'artifacts',appId,'users',user.uid,'instructors'),{name:n}); e.target.reset(); };
          
          const loadDefaultInstructors = async () => {
             const existingNames = new Set(instructors.map(i => i.name));
             const toAdd = DEFAULT_INSTRUCTORS_LIST.filter(name => !existingNames.has(name));
             if (toAdd.length === 0) return showToast("Todos os instrutores padrão já estão cadastrados.");
             await Promise.all(toAdd.map(name => addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'instructors'), { name })));
             showToast(`${toAdd.length} instrutores adicionados!`);
          };

          const handleFileUpload = async (e) => {
              const file = e.target.files[0];
              if (!file) return;
              try {
                  if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                      const rows = await readXlsxFile(file);
                      if (rows.length < 2) return showToast("Ficheiro vazio ou sem dados.");
                      const headers = rows[0].map(h => String(h).trim());
                      const dataObjects = rows.slice(1).map(row => {
                          const obj = {};
                          headers.forEach((header, index) => { obj[header] = row[index] !== undefined ? String(row[index]) : ''; });
                          return obj;
                      });
                      processImportedData(dataObjects);
                  } else {
                      Papa.parse(file, { header: true, skipEmptyLines: true, delimiter: "", complete: (results) => { if (results.data && results.data.length > 0) processImportedData(results.data); else showToast("Ficheiro vazio."); }});
                  }
              } catch (error) { showToast("Erro: " + error.message); }
          };

          const processCSVText = async () => {
             if (!rawCsvData.trim()) return showToast("Cole os dados primeiro.");
             const result = Papa.parse(rawCsvData, { header: true, skipEmptyLines: true });
             if (result.errors.length > 0 && !result.data.length) return showToast("Erro ao ler dados colados.");
             processImportedData(result.data);
          };

          const filteredWeeklyHist = useMemo(() => {
              const result = [];
              
              weeklyHist.forEach(hist => {
                  if (!selectedSchoolFilter && selectedShiftFilter === 'todos') {
                      result.push(hist);
                      return;
                  }
                  
                  if (!hist.breakdown) {
                      return; 
                  }

                  let mat = 0;
                  let att = 0;
                  const targetPolo = selectedSchoolFilter ? normalizeStr(selectedSchoolFilter) : null;

                  Object.entries(hist.breakdown).forEach(([poloName, shifts]) => {
                      if (targetPolo && !poloName.includes(targetPolo) && !targetPolo.includes(poloName)) return;
                      
                      const shiftsToCount = selectedShiftFilter === 'todos' ? ['manha', 'tarde', 'indefinido'] : [selectedShiftFilter];
                      shiftsToCount.forEach(sh => {
                          if (shifts[sh]) {
                              mat += shifts[sh].mat;
                              att += shifts[sh].att;
                          }
                      });
                  });

                  result.push({ ...hist, totalMatriculated: mat, totalAttending: att });
              });
              
              return result;
          }, [weeklyHist, selectedSchoolFilter, selectedShiftFilter]);

          const saveWeeklySnapshot = async () => {
             if (importedStudents.length === 0) return showToast("Sem dados para guardar.");

             let attending = 0;
             const breakdown = {};
             const studentData = {};

             importedStudents.forEach((s, idx) => {
                 const stats = getStudentStats(s, idx);
                 const isAttending = stats.perc > 0;
                 if (isAttending) attending++;

                 studentData[stats.sId] = stats.perc;

                 const poloKey = findSchoolColumn(s);
                 let poloName = s[poloKey] || 'Desconhecido';
                 const normPolo = normalizeStr(poloName);
                 const matchedSchool = schools.find(sch => normPolo.includes(normalizeStr(sch.name)) || normalizeStr(sch.name).includes(normPolo));
                 const finalPoloName = matchedSchool ? normalizeStr(matchedSchool.name) : normPolo;

                 const shift = detectShift(getStudentClass(s));
                 const shiftKey = shift === 'Manhã' ? 'manha' : (shift === 'Tarde' ? 'tarde' : 'indefinido');

                 if (!breakdown[finalPoloName]) {
                     breakdown[finalPoloName] = { manha: { mat: 0, att: 0 }, tarde: { mat: 0, att: 0 }, indefinido: { mat: 0, att: 0 } };
                 }

                 breakdown[finalPoloName][shiftKey].mat++;
                 if (isAttending) breakdown[finalPoloName][shiftKey].att++;
             });
             
             await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'weekly_stats'), {
                 date: new Date().toISOString(), totalMatriculated: importedStudents.length, totalAttending: attending,
                 breakdown: breakdown, 
                 studentData: studentData,
                 weekLabel: new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })
             });
             showToast("Evolução semanal detalhada guardada!");
          };

          // NOVA FUNÇÃO DE EXPORTAÇÃO (AGORA EM PDF)
          const exportGeneralReport = () => {
              if (schoolRankings.full.length === 0) return showToast("Nenhum dado para exportar.");

              const lastWeek = weeklyHist.length > 0 ? weeklyHist[0] : null;

              const tableData = schoolRankings.full.map(polo => {
                  let pastPerc = "Sem dados";
                  
                  if (lastWeek && lastWeek.breakdown && lastWeek.breakdown[polo.name]) {
                      const b = lastWeek.breakdown[polo.name];
                      const totalMat = b.manha.mat + b.tarde.mat + b.indefinido.mat;
                      const totalAtt = b.manha.att + b.tarde.att + b.indefinido.att;
                      pastPerc = totalMat > 0 ? Math.round((totalAtt / totalMat) * 100) : 0;
                  }

                  const evol = pastPerc !== "Sem dados" ? (polo.percentage - pastPerc) + "%" : "-";

                  return [
                      polo.name,
                      pastPerc !== "Sem dados" ? pastPerc + "%" : pastPerc,
                      polo.percentage + "%",
                      evol
                  ];
              });

              // Criação do Documento PDF
              const doc = new jsPDF();
              
              // Cabeçalho do PDF
              doc.setFontSize(18);
              doc.setTextColor(30, 41, 59); // slate-800
              doc.text("Relatório de Frequência - Polos", 14, 22);
              
              doc.setFontSize(10);
              doc.setTextColor(100, 116, 139); // slate-500
              doc.text(`Gerado em: ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}`, 14, 30);

              // Tabela com autoTable
              autoTable(doc, {
                  startY: 38,
                  head: [['Polo', 'Frequência Passada', 'Frequência Nova', 'Evolução']],
                  body: tableData,
                  theme: 'grid',
                  headStyles: { 
                      fillColor: [59, 130, 246], // azul do sistema
                      textColor: 255,
                      fontStyle: 'bold'
                  },
                  styles: { 
                      font: 'helvetica', 
                      fontSize: 10,
                      cellPadding: 5
                  },
                  alternateRowStyles: { 
                      fillColor: [248, 250, 252] // cinza muito claro alternado
                  },
                  columnStyles: {
                      1: { halign: 'center' },
                      2: { halign: 'center' },
                      3: { halign: 'center' }
                  }
              });

              doc.save(`Relatorio_Frequencia_${formatDateLocal(new Date())}.pdf`);
              showToast("Relatório PDF exportado com sucesso!");
          };

          const openEvalModal = (instructorId) => { setEvalData({ instructorId, scores: {}, comments: {} }); setIsEvalModalOpen(true); };
          const openHistoryModal = (instructorId) => {
              const inst = instructors.find(i => i.id === instructorId);
              const evals = evaluations.filter(e => e.instructorId === instructorId).sort((a, b) => new Date(b.date) - new Date(a.date));
              setHistoryData({ instructorName: inst ? inst.name : 'Instrutor Desconhecido', evaluations: evals });
              setIsHistoryModalOpen(true);
          };

          const saveEvaluation = async () => {
              const scores = Object.values(evalData.scores);
              if (scores.length === 0) return showToast("Preencha ao menos uma nota.");
              const avg = scores.reduce((a,b)=>a+b,0) / scores.length;
              await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'evaluations'), { instructorId: evalData.instructorId, scores: evalData.scores, comments: evalData.comments, average: parseFloat(avg.toFixed(1)), date: new Date().toISOString() });
              setIsEvalModalOpen(false);
          };

          const confirmDelete = (type, id, title) => { setDeleteModal({ isOpen: true, type, id, title }); };
          const executeDelete = async () => {
              const { type, id } = deleteModal;
              try {
                  if (type === 'school') await deleteDoc(doc(db,'artifacts',appId,'users',user.uid,'schools',id));
                  else if (type === 'instructor') await deleteDoc(doc(db,'artifacts',appId,'users',user.uid,'instructors',id));
                  else if (type === 'note') await deleteDoc(doc(db,'artifacts',appId,'users',user.uid,'notes',id));
                  else if (type === 'history') await deleteDoc(doc(db,'artifacts',appId,'users',user.uid,'weekly_stats',id));
                  else if (type === 'reset_schools') {
                      const vSnap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'visits'));
                      const sSnap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'schools'));
                      await Promise.all(vSnap.docs.map(d => deleteDoc(d.ref)));
                      await Promise.all(sSnap.docs.map(d => deleteDoc(d.ref)));
                      await Promise.all(DEFAULT_SCHOOLS_LIST.map(name => addDoc(collection(db,'artifacts',appId,'users',user.uid,'schools'), { name })));
                      showToast("✅ Lista corrigida! Escolas e visitas repostas.");
                  }
                  setDeleteModal({ isOpen: false, type: null, id: null, title: '' });
                  if(type !== 'reset_schools') showToast("Apagado com sucesso!");
              } catch (err) { showToast("Erro ao apagar. Verifique a ligação."); }
          };

          const handleShareDashboard = async () => {
              if (!selectedSchoolFilter) return showToast("Filtre um polo antes.");
              const cleanName = selectedSchoolFilter.normalize("NFD").replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
              const shareId = `polo_${cleanName}`;
              try {
                  const studentsData = filteredStudentsList.map((s, idx) => {
                      const stats = getStudentStats(s, idx);
                      return {
                          name: s.n_pessoa, classCode: getStudentClass(s), shift: detectShift(getStudentClass(s)), level: s.n_mc || '',
                          freq: stats.freq, total: stats.tot, percentage: stats.perc, trend: stats.trend, consecutive: stats.cons
                      };
                  });
                  await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shared_dashboards', shareId), { schoolName: selectedSchoolFilter, stats: dashboardStats, students: studentsData, updatedAt: new Date().toISOString() });
                  const shareUrl = `${window.location.origin}${window.location.pathname}#share=${shareId}`;
                  const ta = document.createElement("textarea"); ta.value = shareUrl; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
                  showToast(`✅ Link copiado para partilhar!`);
              } catch (e) { showToast("❌ Erro ao partilhar."); }
          };

          const processImportedData = async (dataList) => {
             const mySchoolNames = new Set(schools.map(s => normalizeStr(s.name)));
             const filteredData = dataList.filter(row => {
                 const poloKey = findSchoolColumn(row);
                 if (!poloKey) return false;
                 return Array.from(mySchoolNames).some(myName => normalizeStr(row[poloKey] || '').includes(myName) || myName.includes(normalizeStr(row[poloKey] || '')));
             });
             if (filteredData.length === 0) {
                 if (dataList.length > 0) setImportAlert({ title: "Atenção na Importação", message: `O sistema leu ${dataList.length} linhas, mas não encontrou alunos das escolas registadas. Verifique os nomes dos polos.`});
                 else showToast("Ficheiro vazio ou ilegível.");
                 return;
             }
             await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'imported_students', 'current_list'), { students: filteredData, updatedAt: new Date().toISOString() });
             showToast(`Sucesso! ${filteredData.length} alunos importados.`);
             if(fileInputRef.current) fileInputRef.current.value = ""; setRawCsvData(""); 
          };

          // --- FIREBASE LISTENERS ---
          useEffect(() => {
            if (configError || isSharedView || !auth) {
                if (configError) setLoading(false);
                return; 
            }
            const unsub = onAuthStateChanged(auth, u => { setUser(u); setLoading(false); });
            return () => unsub();
          }, [isSharedView]);

          useEffect(() => {
            if (!user || isSharedView || !db) return;
            const unsubSchools = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'schools'), s => setSchools(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>a.name.localeCompare(b.name))));
            const unsubVisits = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'visits'), s => setVisits(s.docs.map(d => ({ id: d.id, ...d.data() }))));
            const unsubInstructors = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'instructors'), s => setInstructors(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>a.name.localeCompare(b.name))));
            const unsubNotes = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'notes'), s => setNotes(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))));
            const unsubWeekly = onSnapshot(query(collection(db, 'artifacts', appId, 'users', user.uid, 'weekly_stats'), orderBy('date', 'desc')), s => setWeeklyHist(s.docs.map(d => ({ id: d.id, ...d.data() }))));
            const unsubImported = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'imported_students'), s => { if(!s.empty) setImportedStudents(s.docs[0].data().students || []); });
            const unsubAttendance = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'attendance'), s => { const am = {}; s.docs.forEach(doc => { am[doc.id] = doc.data().present; }); setClassAttendance(am); });
            const unsubEvals = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'evaluations'), s => setEvaluations(s.docs.map(d => ({ id: d.id, ...d.data() }))));
            
            return () => { unsubSchools(); unsubVisits(); unsubInstructors(); unsubNotes(); unsubWeekly(); unsubImported(); unsubAttendance(); unsubEvals(); };
          }, [user, isSharedView]);

          if (configError) return <div className="h-screen flex items-center justify-center p-4 bg-red-50 text-red-700 font-bold">{configError}</div>;
          if (isSharedView) return <PublicDashboard shareId={shareParam} db={db} appId={appId} auth={auth} />;
          if (loading) return <div className="h-screen flex items-center justify-center text-blue-600 font-bold"><Loader2 className="animate-spin mr-2"/> A carregar...</div>;
          if (!user) return <AuthScreen keepLoggedIn={keepLoggedIn} setKeepLoggedIn={setKeepLoggedIn} />;

          return (
            <div className="min-h-screen bg-slate-50 font-sans pb-20 text-slate-800">
               <Toast message={notification} onClose={() => setNotification(null)} />
               
               <header className="bg-white sticky top-0 z-30 shadow-sm hidden md:block">
                 <div className="border-b border-slate-100">
                     <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                         <div className="flex items-center gap-3">
                             <div className="bg-gradient-to-br from-blue-600 to-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                                 <Users2 size={22} strokeWidth={2.5}/>
                             </div>
                             <h1 className="text-xl font-black tracking-tight text-slate-800">Controle Geral</h1>
                         </div>
                         <div className="flex items-center gap-4">
                             <div className="flex items-center gap-2 text-xs font-bold text-slate-500 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                                 <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sistema Online
                             </div>
                             <button onClick={()=>signOut(auth)} title="Terminar Sessão" className="text-slate-400 hover:text-red-500 hover:bg-red-50 p-2.5 rounded-xl transition-all">
                                 <LogOut size={20}/>
                             </button>
                         </div>
                     </div>
                 </div>
                 
                 <div className="bg-slate-50/80 backdrop-blur-md border-b border-slate-200">
                     <div className="max-w-7xl mx-auto px-4 py-2">
                         <nav className="flex items-center gap-2 overflow-x-auto no-scrollbar">
                             {[
                                 { id: 'home', icon: <Home size={16}/>, label: 'Início' },
                                 { id: 'reports', icon: <BarChart2 size={16}/>, label: 'Painéis' },
                                 { id: 'calendar', icon: <Calendar size={16}/>, label: 'Agenda' },
                                 { id: 'schools', icon: <School size={16}/>, label: 'Escolas' },
                                 { id: 'team', icon: <Users size={16}/>, label: 'Equipe' },
                                 { id: 'notes', icon: <Notebook size={16}/>, label: 'Notas' },
                                 { id: 'import', icon: <Upload size={16}/>, label: 'Importar' }
                             ].map(item => (
                                 <button 
                                     key={item.id} 
                                     onClick={()=>setView(item.id)} 
                                     className={`px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-all whitespace-nowrap select-none ${
                                         view === item.id 
                                         ? 'bg-white shadow-sm text-blue-600 border border-slate-200' 
                                         : 'text-slate-500 border border-transparent hover:bg-slate-200/50 hover:text-slate-700'
                                     }`}
                                 >
                                     {item.icon} {item.label}
                                 </button>
                             ))}
                         </nav>
                     </div>
                 </div>
               </header>

               <header className="md:hidden bg-white/95 backdrop-blur-md px-4 py-3 border-b flex justify-between items-center sticky top-0 z-30 pt-safe shadow-sm">
                   <div className="flex items-center gap-2.5">
                       <div className="bg-gradient-to-br from-blue-600 to-indigo-600 text-white p-1.5 rounded-lg shadow-sm">
                           <Users2 size={18} strokeWidth={2.5}/>
                       </div>
                       <span className="font-black text-slate-800 text-lg tracking-tight">Controle Geral</span>
                   </div>
                   <div className="flex items-center gap-3">
                       <div className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.8)]"></div>
                       <button onClick={()=>signOut(auth)} className="text-slate-400 hover:text-red-500 bg-slate-50 hover:bg-red-50 p-2 rounded-xl transition-colors"><LogOut size={18}/></button>
                   </div>
               </header>

               <main className="max-w-7xl mx-auto px-4 py-6 pb-32 animate-fadeIn">
                 {view === 'home' && (
                     <div className="space-y-6">
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl p-8 text-white shadow-lg relative overflow-hidden">
                            <h2 className="text-3xl font-black mb-2 relative z-10">Controle Geral 👋</h2>
                            <p className="opacity-90 font-medium relative z-10">Gestão integrada e segura da sua conta pessoal.</p>
                            <Sparkles className="absolute right-8 bottom-8 opacity-10 text-white" size={100}/>
                        </div>

                        {riskStudents.length > 0 && (
                            <div className="bg-red-50 border border-red-200 p-6 rounded-3xl shadow-sm">
                                <h3 className="text-lg font-extrabold text-red-800 flex items-center gap-2 mb-4"><AlertTriangle className="text-red-600" /> Alerta de Evasão! (3+ Faltas)</h3>
                                <div className="flex gap-3 overflow-x-auto pb-2 custom-scrollbar">
                                    {riskStudents.map((s, i) => (
                                        <div key={i} className="min-w-[150px] bg-white p-3 rounded-xl border border-red-100 shadow-sm text-center">
                                            <div className="font-bold text-red-700 text-sm truncate" title={s.n_pessoa}>{s.n_pessoa}</div>
                                            <div className="text-xs text-red-500 mt-1">{getConsecutiveAbsences(s)} semanas</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">

                                        <span className={`text-[9px] px-3 py-1.5 rounded-lg font-black uppercase tracking-wider ${NOTE_CATEGORIES.find(c=>c.id===n.category)?.color || 'bg-slate-100 text-slate-600'}`}>{NOTE_CATEGORIES.find(c=>c.id===n.category)?.label || 'Geral'}</span>

                               {!editData.isHoliday && !editData.isAbsence && (
